<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Velora</title>
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>

    <header class="checkout-header">
        <a href="store.html" class="logo">VELORA</a>
        <span>Secure Checkout</span>
        <a href="cart.html" class="back-cart">← Back to Cart</a>
    </header>

    <main class="checkout-container">

        <section class="checkout-left">
            <h1>Checkout</h1>
            <p>Complete your order details below.</p>

            <div class="checkout-section">
                <h2>Delivery Address</h2>

                <form id="addressForm">

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="addressLine">House No. / Street Address</label>
                        <input type="text" id="addressLine" required>
                    </div>

                    <div class="form-group">
                        <label for="landmark">Landmark (Optional)</label>
                        <input type="text" id="landmark">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" required>
                        </div>

                        <div class="form-group">
                            <label for="state">State</label>
                            <input type="text" id="state" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="pincode">PIN Code</label>
                            <input type="text" id="pincode" maxlength="6" required>
                        </div>

                        <div class="form-group">
                            <label for="addressType">Address Type</label>
                            <select id="addressType" required>
                                <option value="Home">Home</option>
                                <option value="Work">Work</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="saveAddressBtn">
                        Save Delivery Address
                    </button>

                </form>
            </div>
        </section>

        <aside class="checkout-right">
            <h2>Order Summary</h2>

            <div id="checkoutItems">
                <!-- Cart items will be loaded here -->
            </div>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="checkoutSubtotal">₹0</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="checkoutShipping">₹0</span>
            </div>

            <div class="summary-row total-row">
                <span>Total</span>
                <span id="checkoutTotal">₹0</span>
            </div>

            <button id="placeOrderBtn" disabled>
                Continue to Payment
            </button>
        </aside>

    </main>
<script type="module" src="js/checkout.js"></script>
</body>
</html>
