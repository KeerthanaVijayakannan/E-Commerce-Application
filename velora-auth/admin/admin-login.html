
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora | Admin Login</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-page">

    <div class="admin-login-wrapper">

        <div class="login-brand-panel">
            <a href="../store.html" class="brand-logo">VELORA<span>.</span></a>

            <div class="brand-content">
                <span class="brand-label">ADMINISTRATION</span>
                <h1>Behind every<br>beautiful experience.</h1>
                <p>
                    Manage your products, orders and customers
                    with a little more elegance.
                </p>
            </div>

            <div class="brand-bottom">
                <span>VELORA ADMIN PORTAL</span>
                <span>2026</span>
            </div>
        </div>

        <div class="login-form-panel">

            <div class="login-form-container">
                <div class="login-heading">
                    <span class="welcome-label">WELCOME BACK</span>
                    <h2>Admin Login</h2>
                    <p>Sign in to access your store management dashboard.</p>
                </div>

                <form id="adminLoginForm">

                    <div class="form-group">
                        <label for="adminEmail">Email Address</label>
                        <input
                            type="email"
                            id="adminEmail"
                            placeholder="Enter your admin email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="adminPassword">Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="adminPassword"
                                placeholder="Enter your password"
                                required
                            >

                            <button type="button" id="togglePassword">
                                Show
                            </button>
                        </div>
                    </div>

                    <p id="loginMessage" class="login-message"></p>

                    <button type="submit" class="login-button" id="loginButton">
                        Sign In to Dashboard
                    </button>

                </form>

                <div class="login-footer">
                    <a href="../store.html">← Back to Velora Store</a>
                    <p>Authorized personnel only.</p>
                </div>
            </div>

        </div>

    </div>

    <script src="js/admin-auth.js"></script>

</body>
</html>
