<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Velora</title>
    <link rel="stylesheet" href="css/order-success.css">
</head>
<body>
    <header class="success-header">
        <a href="store.html" class="logo">velora<span>.</span></a>
    </header>

    <main class="success-container">
        <div class="success-icon">✓</div>
        <h1>Thank you for your order!</h1>
        <p class="success-message">
            Your order has been placed successfully.
            We're excited to get your items to you.
        </p>

        <div class="order-card">
            <p class="order-label">Order ID</p>
            <h2 id="orderId">Loading...</h2>

            <div class="order-divider"></div>

            <div class="order-row">
                <span>Order Status</span>
                <strong id="orderStatus">Pending</strong>
            </div>

            <div class="order-row">
                <span>Payment Method</span>
                <strong>Cash on Delivery</strong>
            </div>

            <div class="order-row">
                <span>Total Amount</span>
                <strong id="orderTotal">₹0</strong>
            </div>

            <div class="order-divider"></div>

            <h3>Delivery Address</h3>
            <div id="deliveryAddress"></div>
        </div>

        <div class="success-actions">
            <a href="store.html" class="primary-button">Continue Shopping</a>
            <a href="customer-profile.html" class="secondary-button">My Account</a>
        </div>
    </main>

    <script>
        const order = JSON.parse(
            sessionStorage.getItem("veloraLastOrder") || "null"
        );

        if (!order) {
            document.getElementById("orderId").textContent = "Order not found";
        } else {
            document.getElementById("orderId").textContent = order.orderId;
            document.getElementById("orderStatus").textContent = order.status;
            document.getElementById("orderTotal").textContent =
                "₹" + Number(order.total).toLocaleString("en-IN");

            const address = order.address;

            document.getElementById("deliveryAddress").innerHTML = `
                <p><strong>${address.fullName || ""}</strong></p>
                <p>${address.phone || ""}</p>
                <p>${address.addressLine || ""}</p>
                ${address.landmark ? `<p>${address.landmark}</p>` : ""}
                <p>${address.city || ""}, ${address.state || ""} - ${address.pincode || ""}</p>
            `;
        }
    </script>
    <script src="js/footer.js"></script>
</body>
</html>
