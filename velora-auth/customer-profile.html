<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Velora</title>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

    <header class="profile-navbar">
        <a href="store.html" class="logo">velora<span>.</span></a>

        <div class="nav-actions">
            <a href="store.html" class="back-store">← Continue shopping</a>
            <button id="logoutButton" class="logout-button">Logout</button>
        </div>
    </header>

    <main class="profile-main">

        <section class="profile-heading">
            <p class="eyebrow">YOUR ACCOUNT</p>
            <h1>My Profile</h1>
            <p>Manage your account and explore your Velora activity.</p>
        </section>

        <section class="profile-card">

            <div class="profile-avatar" id="profileAvatar">
                V
            </div>

            <div class="profile-welcome">
                <p class="welcome-label">WELCOME BACK</p>
                <h2 id="profileName">Customer</h2>
                <p id="profileEmail">email@example.com</p>
            </div>

        </section>

        <section class="profile-details-card">

            <div class="section-heading">
                <h2>Account Details</h2>
            </div>

            <div class="profile-details">

                <div class="detail-item">
                    <label>Full Name</label>
                    <p id="detailName">—</p>
                </div>

                <div class="detail-item">
                    <label>Email Address</label>
                    <p id="detailEmail">—</p>
                </div>

                <div class="detail-item">
                    <label>Customer ID</label>
                    <p id="detailUserId">—</p>
                </div>

                <div class="detail-item">
                    <label>Account Type</label>
                    <p id="detailRole">Customer</p>
                </div>

            </div>

        </section>

        <section class="profile-shortcuts">

            <a href="cart.html" class="shortcut-card">
                <div class="shortcut-icon">🛍</div>
                <div>
                    <h3>My Cart</h3>
                    <p>View your saved shopping items</p>
                </div>
                <span class="shortcut-arrow">→</span>
            </a>

            <div class="shortcut-card orders-card">
                <div class="shortcut-icon">📦</div>
                <div>
                    <h3>My Orders</h3>
                    <p>Order history will be available here</p>
                </div>
                <span class="shortcut-arrow">→</span>
            </div>

        </section>

    </main>

    <script src="js/profile.js"></script>

</body>
</html>
